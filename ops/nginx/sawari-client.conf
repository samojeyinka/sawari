server {
    listen 80;
    listen [::]:80;
    server_name sawari.synchrome.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sawari.synchrome.co;

    ssl_certificate /etc/ssl/certs/synchrome-origin.pem;
    ssl_certificate_key /etc/ssl/private/synchrome-origin-key.pem;

    root /var/www/sawari/client/dist;
    index index.html;

    # The SPA owns /courses and /courses/:slug. Revalidate the app shell so
    # browsers and edge caches pick up each deployed asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Keep legacy explore URLs working through the API's redirect.
    location ~ ^/explore(/|$) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
